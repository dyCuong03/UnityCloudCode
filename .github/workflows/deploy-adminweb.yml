# Deploy AdminWeb to Cloudflare Pages
#
# Single Cloudflare Pages project:
#   - AdminWeb/dist      -> static SPA
#   - AdminWeb/functions -> same-origin API proxy at /api/*
#
# Secrets are synced into Cloudflare Pages before each deploy and are available
# only to Pages Functions via context.env. They are never injected into the SPA.
#
# PRODUCTION PROMOTION MODEL
# --------------------------
# The custom domain (global-mails.buzzle.dev) only ever serves the Pages
# *production* deployment, i.e. the latest deployment whose Wrangler --branch
# equals the project's configured production branch. Passing the raw source
# branch (github.ref_name) made every release/* — and any non-default branch —
# a *preview* deployment, so the custom domain stayed frozen on an old build.
#
# This workflow therefore ALWAYS deploys with --branch=<canonical production
# branch> (default: staging). Both `staging` and `release/**` pushes promote the
# newest AdminWeb build to the production environment of the SAME Pages project,
# and the real source branch + commit SHA are preserved in the deployment
# metadata and logs.
#
# Required GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN                  - Cloudflare API token with Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID                 - Cloudflare account ID
#   UNITY_PROJECT_SERVICE_ACCOUNT_KEY     - UGS service-account key ID
#   UNITY_PROJECT_SERVICE_ACCOUNT_SECRET  - UGS service-account secret
#   ADMIN_PROXY_TOKEN                     - Gate token the SPA presents as Bearer
#
# Required GitHub repository variables (validated, no auto-selection):
#   CLOUDFLARE_PAGES_PROJECT          = adminweb-fza
#   CLOUDFLARE_PAGES_CUSTOM_DOMAIN    = global-mails.buzzle.dev
#
# Optional GitHub repository variable:
#   CLOUDFLARE_PAGES_PRODUCTION_BRANCH - Canonical Pages production branch.
#                                        Defaults to `staging` when unset.

name: Deploy AdminWeb to Cloudflare Pages

on:
  push:
    branches:
      - staging
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

# One GLOBAL production concurrency group. staging and release/** deployments
# target the same production environment, so they must never run concurrently.
# cancel-in-progress is false: let an in-flight production deploy finish rather
# than abort it half-way; the newest queued run promotes last and wins.
concurrency:
  group: adminweb-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: AdminWeb/package-lock.json

      - name: Install dependencies
        working-directory: AdminWeb
        run: npm ci

      # Bake connection config into the SPA bundle so operators never type the
      # project id / operator id in the browser. None of these are secret (the
      # project id and env names appear in Cloud Code URLs); the only real
      # secret, the proxy access token, is still entered by hand at runtime.
      #   Repo variable (optional): ADMINWEB_OPERATOR_ID — hides the operator field.
      - name: Build SPA
        working-directory: AdminWeb
        env:
          VITE_BASE: /
          VITE_PROJECT_ID: ${{ vars.UNITY_PROJECT_ID }}
          VITE_OPERATOR_ID: ${{ vars.ADMINWEB_OPERATOR_ID }}
          VITE_MODULE_NAME: ${{ vars.ADMINWEB_MODULE_NAME }}
          VITE_ENV_TESTING: ${{ secrets.UNITY_ENVIRONMENT }}
          VITE_ENV_PRODUCTION: ${{ secrets.UNITY_ENVIRONMENT_PRODUCTION }}
        run: npm run build

      # ------------------------------------------------------------------
      # Validate configuration. No auto-selection: the Pages project and
      # custom domain are pinned via required repo variables and must match
      # the expected values exactly, or the deploy fails early.
      # ------------------------------------------------------------------
      - name: Validate configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_PAGES_CUSTOM_DOMAIN }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
        run: |
          set -euo pipefail

          # Expected (canonical) values. The repo variables must match these.
          EXPECTED_PROJECT="adminweb-fza"
          EXPECTED_DOMAIN="global-mails.buzzle.dev"
          DEFAULT_PRODUCTION_BRANCH="staging"

          fail=0

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: secret CLOUDFLARE_API_TOKEN is missing."
            fail=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ERROR: secret CLOUDFLARE_ACCOUNT_ID is missing."
            fail=1
          fi

          PROJECT="$(printf '%s' "${CLOUDFLARE_PAGES_PROJECT:-}" | tr -d '[:space:]')"
          DOMAIN="$(printf '%s' "${CLOUDFLARE_PAGES_CUSTOM_DOMAIN:-}" | tr -d '[:space:]')"
          PROD_BRANCH="$(printf '%s' "${CLOUDFLARE_PAGES_PRODUCTION_BRANCH:-}" | tr -d '[:space:]')"
          [ -n "$PROD_BRANCH" ] || PROD_BRANCH="$DEFAULT_PRODUCTION_BRANCH"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: repo variable CLOUDFLARE_PAGES_PROJECT is missing."
            echo "       Set it to '$EXPECTED_PROJECT' (Settings > Secrets and variables > Actions > Variables)."
            fail=1
          elif [ "$PROJECT" != "$EXPECTED_PROJECT" ]; then
            echo "ERROR: CLOUDFLARE_PAGES_PROJECT='$PROJECT' is unexpected (expected '$EXPECTED_PROJECT')."
            echo "       Refusing to deploy to an unverified Pages project."
            fail=1
          fi

          if [ -z "$DOMAIN" ]; then
            echo "ERROR: repo variable CLOUDFLARE_PAGES_CUSTOM_DOMAIN is missing."
            echo "       Set it to '$EXPECTED_DOMAIN'."
            fail=1
          elif [ "$DOMAIN" != "$EXPECTED_DOMAIN" ]; then
            echo "ERROR: CLOUDFLARE_PAGES_CUSTOM_DOMAIN='$DOMAIN' is unexpected (expected '$EXPECTED_DOMAIN')."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Configuration validation failed. See errors above."
            exit 1
          fi

          {
            echo "CF_PAGES_PROJECT=$PROJECT"
            echo "CF_PAGES_CUSTOM_DOMAIN=$DOMAIN"
            echo "CF_PAGES_PRODUCTION_BRANCH=$PROD_BRANCH"
          } >> "$GITHUB_ENV"

          echo "Pages project:      $PROJECT"
          echo "Custom domain:      $DOMAIN"
          echo "Production branch:   $PROD_BRANCH"
          echo "Source branch:       ${GITHUB_REF_NAME}"

      # ------------------------------------------------------------------
      # Ensure the project exists. For a brand-new project the production
      # branch is set at creation; for an existing project it is reconciled
      # in the next step (create's --production-branch does not repair it).
      # ------------------------------------------------------------------
      - name: Ensure Cloudflare Pages project
        working-directory: AdminWeb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Ensuring Cloudflare Pages project '$CF_PAGES_PROJECT' exists."
          set +e
          npx wrangler@3.65.0 pages project create "$CF_PAGES_PROJECT" \
            --production-branch="$CF_PAGES_PRODUCTION_BRANCH" > create-project.log 2>&1
          CREATE_EXIT=$?
          set -e

          cat create-project.log
          if [ "$CREATE_EXIT" -eq 0 ]; then
            echo "Cloudflare Pages project '$CF_PAGES_PROJECT' created."
          elif grep -qi "already exists" create-project.log; then
            echo "Cloudflare Pages project '$CF_PAGES_PROJECT' already exists."
          else
            echo "ERROR: failed to ensure Cloudflare Pages project '$CF_PAGES_PROJECT'."
            exit "$CREATE_EXIT"
          fi

      # ------------------------------------------------------------------
      # Reconcile the production branch of the EXISTING project via the
      # Cloudflare API. This is what actually repairs a project whose
      # production branch drifted (the root cause of the stale custom domain).
      # ------------------------------------------------------------------
      - name: Reconcile Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          ;(async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
            const project = process.env.CF_PAGES_PROJECT
            const wanted = process.env.CF_PAGES_PRODUCTION_BRANCH

            const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}`
            const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

            const getRes = await fetch(base, { headers })
            const getJson = await getRes.json()
            if (!getRes.ok || !getJson.success) {
              console.error(`Failed to read Pages project '${project}'.`)
              console.error(JSON.stringify(getJson.errors || getJson, null, 2))
              process.exit(1)
            }

            const current = getJson.result && getJson.result.production_branch
            console.log(`Current production branch: ${current}`)
            console.log(`Desired production branch: ${wanted}`)

            if (current === wanted) {
              console.log('Production branch already correct — no change.')
              return
            }

            console.log(`Updating production branch '${current}' -> '${wanted}'.`)
            const patchRes = await fetch(base, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ production_branch: wanted }),
            })
            const patchJson = await patchRes.json()
            if (!patchRes.ok || !patchJson.success) {
              console.error('ERROR: failed to update the Pages production branch via the Cloudflare API.')
              console.error(JSON.stringify(patchJson.errors || patchJson, null, 2))
              console.error('')
              console.error('Remediation: open Cloudflare dashboard > Workers & Pages >')
              console.error(`  ${project} > Settings > Builds & deployments and set the`)
              console.error(`  Production branch to '${wanted}', then re-run this workflow.`)
              process.exit(1)
            }

            const updated = patchJson.result && patchJson.result.production_branch
            if (updated !== wanted) {
              console.error(`ERROR: production branch is '${updated}' after update, expected '${wanted}'.`)
              process.exit(1)
            }
            console.log(`Production branch is now '${updated}'.`)
          })().catch((err) => { console.error(err); process.exit(1) })
          NODE

      # ------------------------------------------------------------------
      # Attach the custom domain (idempotent) and VERIFY it belongs to this
      # project. A domain attached to a different project would silently
      # serve the wrong build, so a missing domain after attach is fatal.
      # ------------------------------------------------------------------
      - name: Attach and verify custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          ;(async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
            const project = process.env.CF_PAGES_PROJECT
            const customDomain = process.env.CF_PAGES_CUSTOM_DOMAIN

            const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/domains`
            const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

            const listDomains = async () => {
              const res = await fetch(base, { headers })
              const json = await res.json()
              if (!res.ok || !json.success) {
                console.error(`Failed to list domains for project '${project}'.`)
                console.error(JSON.stringify(json.errors || json, null, 2))
                process.exit(1)
              }
              return Array.isArray(json.result) ? json.result.map((d) => d.name) : []
            }

            let domains = await listDomains()
            if (!domains.includes(customDomain)) {
              console.log(`Attaching custom domain '${customDomain}' to '${project}'.`)
              const addRes = await fetch(base, {
                method: 'POST',
                headers,
                body: JSON.stringify({ name: customDomain }),
              })
              const addJson = await addRes.json()
              const alreadyInUse =
                (addJson.errors || []).some((e) => /already (exists|in use)/i.test(e.message || ''))
              if ((!addRes.ok || !addJson.success) && !alreadyInUse) {
                console.error('Failed to attach custom domain.')
                console.error(JSON.stringify(addJson.errors || addJson, null, 2))
                process.exit(1)
              }
              domains = await listDomains()
            } else {
              console.log(`Custom domain '${customDomain}' already attached to '${project}'.`)
            }

            // Verification: the domain MUST belong to this project now.
            if (!domains.includes(customDomain)) {
              console.error(`ERROR: custom domain '${customDomain}' is not attached to project '${project}'.`)
              console.error('It may be bound to a different Pages project. Detach it there first,')
              console.error(`then re-run so it can be attached to '${project}'.`)
              process.exit(1)
            }
            console.log(`Verified: '${customDomain}' belongs to project '${project}'.`)
          })().catch((err) => { console.error(err); process.exit(1) })
          NODE

      # ------------------------------------------------------------------
      # Sync secrets to BOTH the production and preview environments so the
      # custom domain (production) and any *.pages.dev preview behave the same.
      # Secret values are written to a temp file and never echoed.
      # ------------------------------------------------------------------
      - name: Sync Pages secrets
        working-directory: AdminWeb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNITY_PROJECT_SERVICE_ACCOUNT_KEY: ${{ secrets.UNITY_PROJECT_SERVICE_ACCOUNT_KEY }}
          UNITY_PROJECT_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_PROJECT_SERVICE_ACCOUNT_SECRET }}
          ADMIN_PROXY_TOKEN: ${{ secrets.ADMIN_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const keys=['UNITY_PROJECT_SERVICE_ACCOUNT_KEY','UNITY_PROJECT_SERVICE_ACCOUNT_SECRET','ADMIN_PROXY_TOKEN']; const out=Object.fromEntries(keys.map(k=>[k,process.env[k]||''])); for (const [k,v] of Object.entries(out)) { if (!v) { console.error('Missing secret: '+k); process.exit(1); } } fs.writeFileSync('.pages-secrets.json', JSON.stringify(out));"
          trap 'rm -f .pages-secrets.json' EXIT
          npx wrangler@3.65.0 pages secret bulk .pages-secrets.json --project-name="$CF_PAGES_PROJECT" --env=production
          npx wrangler@3.65.0 pages secret bulk .pages-secrets.json --project-name="$CF_PAGES_PROJECT" --env=preview

      # ------------------------------------------------------------------
      # Deploy. ALWAYS use the canonical production branch so Cloudflare
      # treats this as a production deployment and promotes it to the custom
      # domain. The real source branch + SHA live in the deployment metadata.
      # ------------------------------------------------------------------
      - name: Deploy SPA and API to Cloudflare Pages
        id: deploy-pages
        working-directory: AdminWeb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@3.65.0 pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="$CF_PAGES_PRODUCTION_BRANCH" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA}) to production" \
            2>&1 | tee deploy.log
          DEPLOYMENT_URL=$(node -e "const fs=require('fs'); const text=fs.readFileSync('deploy.log','utf8'); const urls=[...text.matchAll(/https:\\/\\/[^\\s]+/g)].map(m=>m[0].replace(/[),.]+$/,'')); const picked=urls.find(u=>u.includes('.pages.dev')) || urls[0] || ''; if (!picked) process.exit(1); console.log(picked)")
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test same-origin API
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "ERROR: wrangler did not return a deployment URL."
            exit 1
          fi

          # The per-deployment URL is <hash>.<project>.pages.dev — a 4-label host
          # that the Cloudflare '*.pages.dev' wildcard cert does NOT cover, so
          # curling it fails the TLS handshake. Build cert-valid candidates and
          # test those instead: the project alias (<project>.pages.dev, which
          # serves the latest production deployment) and the custom domain.
          HOST="$(printf '%s' "$DEPLOYMENT_URL" | sed -E 's#^https?://##; s#/.*$##')"
          DOTS="$(printf '%s' "$HOST" | tr -cd '.' | wc -c)"
          CANDIDATES=""
          if [ "$DOTS" -ge 3 ]; then
            # Strip the leading <hash> label -> <project>.pages.dev (cert-valid).
            ALIAS_HOST="$(printf '%s' "$HOST" | sed -E 's#^[^.]+\.##')"
            CANDIDATES="https://${ALIAS_HOST}"
          else
            CANDIDATES="https://${HOST}"
          fi
          if [ -n "${CF_PAGES_CUSTOM_DOMAIN:-}" ]; then
            CANDIDATES="$CANDIDATES https://${CF_PAGES_CUSTOM_DOMAIN}"
          fi
          echo "Health-check candidates: $CANDIDATES"

          for i in 1 2 3 4 5 6; do
            for BASE in $CANDIDATES; do
              HEALTH_URL="${BASE%/}/api/health"
              HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" "$HEALTH_URL" || true)
              RESPONSE=$(cat response.json 2>/dev/null || true)
              echo "Attempt $i: $HEALTH_URL -> HTTP $HTTP_CODE"
              echo "Response: $RESPONSE"
              if [ "$HTTP_CODE" = "200" ] && echo "$RESPONSE" | grep -q '"ok":true'; then
                exit 0
              fi
            done
            sleep 10
          done

          echo "ERROR: health check did not return HTTP 200 with {\"ok\":true}"
          exit 1

      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then ICON="SUCCESS"; else ICON="FAILED"; fi
          PAGES_URL="${DEPLOYMENT_URL:-Unavailable}"
          {
            echo "## AdminWeb Pages Deploy - $ICON"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Pages URL** | $PAGES_URL |"
            echo "| **Custom Domain** | https://${CF_PAGES_CUSTOM_DOMAIN:-Unavailable} |"
            echo "| **Deployed as branch** | ${CF_PAGES_PRODUCTION_BRANCH:-Unavailable} (production) |"
            echo "| **API** | /api/* same-origin Pages Function |"
            echo "| **Source branch** | ${{ github.ref_name }} |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Status** | $STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
